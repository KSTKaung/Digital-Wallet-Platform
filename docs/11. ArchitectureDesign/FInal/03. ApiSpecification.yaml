      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: Unfrozen }

  /api/v1/admin/customers/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend a customer account
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
