  /api/v1/admin/approvals:
    get:
      tags: [Admin]
      summary: List pending maker-checker approvals
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }

  /api/v1/admin/approvals/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending request (checker step)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Approved
          content:
