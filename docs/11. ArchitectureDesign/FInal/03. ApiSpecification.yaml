        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
    post:
      tags: [Admin]
      summary: Create an admin user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUser' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }

  /api/v1/admin/roles:
    get:
      tags: [Admin]
      summary: List roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Admin]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }

  /api/v1/admin/permissions:
    get:
      tags: [Admin]
      summary: List available permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Search audit logs
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Client-generated unique key; replays with the same key return the original result instead of re-executing.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid credentials/token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource already exists / state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        errorCode: { type: string, example: INSUFFICIENT_BALANCE }
        message: { type: string }
        correlationId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    # --- Identity ---
    RegisterRequest:
      type: object
      required: [email, phoneNumber, password]
      properties:
        email: { type: string, format: email }
        phoneNumber: { type: string }
        password: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        phoneNumber: { type: string }
        status: { type: string }
        emailVerified: { type: boolean }
        phoneVerified: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: seconds }
    OtpVerifyRequest:
      type: object
      required: [otp, purpose]
      properties:
        otp: { type: string }
        purpose: { type: string, enum: [REGISTRATION, PASSWORD_RESET, LOGIN] }

    # --- Customer / KYC ---
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        customerNumber: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string }
        createdAt: { type: string, format: date-time }
    CustomerUpdateRequest:
      type: object
      properties:
        dateOfBirth: { type: string, format: date }
        countryCode: { type: string }
    KycApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED] }
        verificationLevel: { type: string, enum: [BASIC, FULL] }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
        rejectionReason: { type: string }
    KycApplicationCreateRequest:
      type: object
      required: [verificationLevel]
      properties:
        verificationLevel: { type: string, enum: [BASIC, FULL] }
        documentType: { type: string }
        documentReference: { type: string }

    # --- Wallet ---
    Wallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        walletNumber: { type: string }
        currency: { type: string, example: THB }
        status: { type: string, enum: [ACTIVE, FROZEN, CLOSED] }
        availableBalance: { type: number, format: double }
        reservedBalance: { type: number, format: double }
    WalletBalance:
      type: object
      properties:
        availableBalance: { type: number, format: double }
        reservedBalance: { type: number, format: double }
        currency: { type: string }
    WalletLimits:
      type: object
      properties:
        dailyTransfer: { type: number, format: double }
        dailyWithdrawal: { type: number, format: double }
        dailyDeposit: { type: number, format: double }
        singleTransfer: { type: number, format: double }
        singleWithdrawal: { type: number, format: double }
    DepositRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double }
        currency: { type: string }
        reference: { type: string }
    DepositResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        amount: { type: number, format: double }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, CANCELLED] }
        reference: { type: string }
    WithdrawalRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double }
        currency: { type: string }
    WithdrawalResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        amount: { type: number, format: double }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, CANCELLED] }
        reference: { type: string }

    # --- Transfer ---
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderCustomerId: { type: string, format: uuid }
        receiverCustomerId: { type: string, format: uuid }
        senderWalletId: { type: string, format: uuid }
        receiverWalletId: { type: string, format: uuid }
        amount: { type: number, format: double }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED] }
        reference: { type: string }
        description: { type: string }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    TransferCreateRequest:
      type: object
      required: [receiverCustomerId, amount, currency]
      properties:
        receiverCustomerId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        amount: { type: number, format: double }
        currency: { type: string }
        description: { type: string }
    Beneficiary:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        beneficiaryCustomerId: { type: string, format: uuid }
        nickname: { type: string }
        status: { type: string, enum: [ACTIVE, BLOCKED, DELETED] }
    BeneficiaryCreateRequest:
      type: object
      required: [beneficiaryCustomerId]
      properties:
        beneficiaryCustomerId: { type: string, format: uuid }
        nickname: { type: string }

    # --- Payment & Merchant ---
    Merchant:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        merchantNumber: { type: string }
        businessName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, SUSPENDED] }
    MerchantCreateRequest:
      type: object
      required: [businessName]
      properties:
        businessName: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        amount: { type: number, format: double }
        currency: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        reference: { type: string }
        paymentMethod: { type: string }
    PaymentCreateRequest:
      type: object
      required: [merchantId, amount, currency]
      properties:
        merchantId: { type: string, format: uuid }
        amount: { type: number, format: double }
        currency: { type: string }
        paymentMethod: { type: string, enum: [WALLET, QR] }
    QrCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        qrReference: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, USED] }
        expiresAt: { type: string, format: date-time }
    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount: { type: number, format: double }
        reason: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        reference: { type: string }
    RefundCreateRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: number, format: double }
        reason: { type: string }

    # --- Ledger (internal) ---
    LedgerAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountNumber: { type: string }
        accountType: { type: string, enum: [CUSTOMER, MERCHANT, SYSTEM, FEE, SUSPENSE] }
        ownerReference: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string, enum: [ACTIVE, FROZEN, CLOSED] }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        financialTransactionId: { type: string, format: uuid }
        ledgerAccountId: { type: string, format: uuid }
        entryType: { type: string, enum: [DEBIT, CREDIT] }
        amount: { type: number, format: double }
        createdAt: { type: string, format: date-time }
    FinancialTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionReference: { type: string }
        transactionType: { type: string }
        status: { type: string }
        currency: { type: string }
        totalAmount: { type: number, format: double }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
    LedgerPostingRequest:
      type: object
      required: [transactionReference, transactionType, currency, entries]
      properties:
        transactionReference: { type: string }
        transactionType: { type: string, enum: [DEPOSIT, WITHDRAWAL, TRANSFER, PAYMENT, REFUND, REVERSAL] }
        currency: { type: string }
        entries:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              ledgerAccountId: { type: string, format: uuid }
              entryType: { type: string, enum: [DEBIT, CREDIT] }
              amount: { type: number, format: double }

    # --- Risk ---
    RiskAssessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        riskScore: { type: number, format: double }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        decision: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        reason: { type: string }
    FraudAlert:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        riskAssessmentId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, UNDER_REVIEW, RESOLVED] }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        description: { type: string }
        assignedTo: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }

    # --- Notification ---
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        channel: { type: string, enum: [EMAIL, SMS, PUSH] }
        title: { type: string }
        message: { type: string }
        status: { type: string, enum: [PENDING, SENT, FAILED, READ] }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      properties:
        emailEnabled: { type: boolean }
        smsEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        transactionAlerts: { type: boolean }
        securityAlerts: { type: boolean }
        marketingEnabled: { type: boolean }

    # --- Admin ---
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        employeeNumber: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource: { type: string }
        action: { type: string }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorType: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        oldValue: { type: object }
        newValue: { type: object }
        correlationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      properties:
        id: { type: string, format: uuid }
        requestType: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
