        '200': { description: OK }

  /api/v1/admin/transactions/{id}:
    get:
      tags: [Admin]
      summary: Get a transaction detail (admin view)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: OK }

  /api/v1/admin/fraud-alerts:
    get:
      tags: [Admin]
      summary: List fraud alerts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
