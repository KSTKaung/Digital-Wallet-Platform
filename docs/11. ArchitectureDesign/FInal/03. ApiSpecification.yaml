openapi: 3.0.3
info:
  title: Banking Digital Wallet Platform API
  description: >
    Consolidated public + internal API surface across all 8 business services,
    fronted by a single API Gateway. Internal-only paths (/internal/v1/**) are
    never exposed through the public gateway and are documented here for
    service-to-service integration reference only.
  version: "1.0.0"
servers:
  - url: https://api.wallet-platform.example.com
    description: Production (via API Gateway)
  - url: http://localhost:8080
    description: Local (docker-compose, via Gateway)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Identity Service — public
  - name: Customer
    description: Customer & KYC Service — public
  - name: KYC
    description: Customer & KYC Service — public
  - name: Wallet
    description: Wallet Service — public
  - name: Transfer
    description: Transfer Service — public
  - name: Beneficiary
    description: Transfer Service — public
  - name: Merchant
    description: Payment & Merchant Service — public
  - name: Payment
    description: Payment & Merchant Service — public
  - name: Refund
    description: Payment & Merchant Service — public
  - name: Ledger (internal)
    description: Ledger Service — internal only, not gateway-routed
  - name: Risk (internal)
    description: Risk Service — internal only, not gateway-routed
  - name: Notification
    description: Risk & Notification Service — public
  - name: Admin
    description: Admin & Operations Service — public, requires ADMIN role

paths:
  # ============================ IDENTITY ============================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User registered, verification required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session/refresh token
      responses:
        '204': { description: Logged out }

  /api/v1/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200': { description: OTP verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend an OTP code
      security: []
      responses:
        '202': { description: OTP resent }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Start password reset flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Reset instructions sent if account exists }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resetToken: { type: string }
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password while authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============================ CUSTOMER & KYC ============================
  /api/v1/customers/me:
    get:
      tags: [Customer]
      summary: Get the authenticated customer's profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
    put:
      tags: [Customer]
      summary: Update the authenticated customer's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /api/v1/kyc/applications:
    post:
      tags: [KYC]
      summary: Submit a new KYC application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycApplicationCreateRequest' }
      responses:
        '201':
          description: Application created (draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycApplication' }

  /api/v1/kyc/applications/{id}:
    get:
      tags: [KYC]
      summary: Get a KYC application by ID
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycApplication' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/kyc/applications/{id}/submit:
    post:
      tags: [KYC]
      summary: Submit a draft KYC application for review
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Submitted — status moves to PENDING_REVIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycApplication' }

  /api/v1/kyc/status:
    get:
      tags: [KYC]
      summary: Get the authenticated customer's current KYC status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  verificationLevel: { type: string }

  # ============================ WALLET ============================
  /api/v1/wallet:
    get:
      tags: [Wallet]
      summary: Get the authenticated customer's wallet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

  /api/v1/wallet/balance:
    get:
      tags: [Wallet]
      summary: Get current available/reserved balance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }

  /api/v1/wallet/deposits:
    post:
      tags: [Wallet]
      summary: Deposit funds into the wallet
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositRequest' }
      responses:
        '201':
          description: Deposit accepted/completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepositResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/wallet/withdrawals:
    post:
      tags: [Wallet]
      summary: Withdraw funds from the wallet
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalRequest' }
      responses:
        '201':
          description: Withdrawal accepted/completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Insufficient balance or daily limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/wallet/limits:
    get:
      tags: [Wallet]
      summary: Get wallet transaction limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletLimits' }

  /api/v1/wallet/status:
    get:
      tags: [Wallet]
      summary: Get wallet status (ACTIVE/FROZEN/CLOSED)
      responses:
        '200': { description: OK }

  /api/v1/wallet/freeze:
    post:
      tags: [Wallet]
      summary: Freeze the wallet (self-service or admin-triggered)
      responses:
        '200': { description: Wallet frozen }

  /api/v1/wallet/unfreeze:
    post:
      tags: [Wallet]
      summary: Unfreeze the wallet (admin-triggered)
      responses:
        '200': { description: Wallet unfrozen }

  # ============================ TRANSFER ============================
  /api/v1/transfers:
    post:
      tags: [Transfer]
      summary: Initiate a transfer to another customer
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferCreateRequest' }
      responses:
        '201':
          description: Transfer created/completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '409':
          description: "Duplicate idempotency key, insufficient balance, or limit exceeded"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Transfer]
      summary: List transfers for the authenticated customer
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Transfer' }
                  page: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/transfers/{id}:
    get:
      tags: [Transfer]
      summary: Get a transfer by ID
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/transfers/{id}/status:
    get:
      tags: [Transfer]
      summary: Get just the status of a transfer (lightweight polling)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/v1/transfers/{id}/cancel:
    post:
      tags: [Transfer]
      summary: Cancel a pending transfer
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '409':
          description: Transfer already completed, cannot cancel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/beneficiaries:
    get:
      tags: [Beneficiary]
      summary: List saved beneficiaries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Beneficiary' }
    post:
      tags: [Beneficiary]
      summary: Add a beneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }

  /api/v1/beneficiaries/{id}:
    get:
      tags: [Beneficiary]
      summary: Get a beneficiary by ID
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
    put:
      tags: [Beneficiary]
      summary: Update a beneficiary (e.g. nickname)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryCreateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Beneficiary' }
    delete:
      tags: [Beneficiary]
      summary: Remove a beneficiary
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '204': { description: Deleted }

  # ============================ PAYMENT & MERCHANT ============================
  /api/v1/merchants:
    post:
      tags: [Merchant]
      summary: Register as a merchant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantCreateRequest' }
      responses:
        '201':
          description: Merchant application created (pending approval)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }

  /api/v1/merchants/me:
    get:
      tags: [Merchant]
      summary: Get the authenticated merchant profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
    put:
      tags: [Merchant]
      summary: Update merchant profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantCreateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }

  /api/v1/merchants/me/payments:
    get:
      tags: [Merchant]
      summary: List payments received by the authenticated merchant
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }

  /api/v1/merchants/me/settlements:
    get:
      tags: [Merchant]
      summary: List settlement batches for the authenticated merchant
      responses:
        '200': { description: OK }

  /api/v1/payments:
    post:
      tags: [Payment]
      summary: Create a payment (customer pays a merchant)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateRequest' }
      responses:
        '201':
          description: Payment created/completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
    get:
      tags: [Payment]
      summary: List payments for the authenticated customer
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }

  /api/v1/payments/{id}:
    get:
      tags: [Payment]
      summary: Get a payment by ID
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }

  /api/v1/payments/qr/scan:
    post:
      tags: [Payment]
      summary: Scan a merchant QR code to initiate payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qrReference: { type: string }
      responses:
        '200':
          description: QR resolved — merchant + amount details returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrCode' }

  /api/v1/payments/qr/confirm:
    post:
      tags: [Payment]
      summary: Confirm a scanned QR payment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qrReference: { type: string }
                amount: { type: number, format: double }
      responses:
        '201':
          description: Payment completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }

  /api/v1/payments/{id}/refunds:
    post:
      tags: [Refund]
      summary: Refund a completed payment (full or partial)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
      responses:
        '201':
          description: Refund created/completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
    get:
      tags: [Refund]
      summary: List refunds issued against a payment
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }

  # ============================ LEDGER (INTERNAL) ============================
  /internal/v1/ledger/entries:
    post:
      tags: [Ledger (internal)]
      summary: Post a balanced set of debit/credit entries for a financial transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LedgerPostingRequest' }
      responses:
        '201':
          description: Entries posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialTransaction' }
        '422':
          description: Debits and credits do not balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/v1/ledger/accounts/{accountId}:
    get:
      tags: [Ledger (internal)]
      summary: Get a ledger account
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerAccount' }

  /internal/v1/ledger/accounts/{accountId}/entries:
    get:
      tags: [Ledger (internal)]
      summary: List ledger entries for an account
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LedgerEntry' }

  /internal/v1/ledger/transactions/{transactionId}:
    get:
      tags: [Ledger (internal)]
      summary: Get a financial transaction with its entries
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialTransaction' }

  /internal/v1/ledger/transactions/{transactionId}/reverse:
    post:
      tags: [Ledger (internal)]
      summary: Reverse a completed financial transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '201':
          description: Reversal transaction created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialTransaction' }

  # ============================ RISK (INTERNAL) ============================
  /internal/v1/risk/evaluate:
    post:
      tags: [Risk (internal)]
      summary: Evaluate a transaction for fraud risk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                amount: { type: number, format: double }
                currency: { type: string }
      responses:
        '200':
          description: Risk assessment result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAssessment' }

  /internal/v1/risk/transactions/{transactionId}:
    get:
      tags: [Risk (internal)]
      summary: Get the risk assessment for a transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAssessment' }

  # ============================ NOTIFICATION ============================
  /api/v1/notifications:
    get:
      tags: [Notification]
      summary: List notifications for the authenticated user
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notification]
      summary: Mark a notification as read
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200': { description: Marked read }

  /api/v1/notifications/read-all:
    post:
      tags: [Notification]
      summary: Mark all notifications as read
      responses:
        '200': { description: All marked read }

  /api/v1/notification-preferences:
    get:
      tags: [Notification]
      summary: Get notification preferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Notification]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }

  # ============================ ADMIN & OPERATIONS ============================
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard summary metrics
      responses:
        '200': { description: OK }

  /api/v1/admin/customers:
    get:
      tags: [Admin]
      summary: List/search customers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }

  /api/v1/admin/customers/{id}:
    get:
      tags: [Admin]
      summary: Get a customer by ID (admin view)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /api/v1/admin/customers/{id}/freeze:
    post:
      tags: [Admin]
      summary: Freeze a customer's account/wallet
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
