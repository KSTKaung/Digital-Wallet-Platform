name: Frontend

on:
  pull_request:
    paths: ["frontend/**", "openapi/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "openapi/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      # documentations/08 §4E E2: the committed types must equal those generated from the
      # committed document (../openapi/openapi.json, the script's default source).
      - name: Check API types against openapi/openapi.json
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error file=frontend/src/api/schema.d.ts::schema.d.ts is out of date with openapi/openapi.json: run npm run api:types"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Test with coverage thresholds
        run: npm run coverage
      - run: npm run build
