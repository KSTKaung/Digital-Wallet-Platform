name: Containers

on:
  pull_request:
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compose config and image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI-only .env from the template
        run: cp .env.example .env
      - name: Validate compose.yaml
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build

  smoke:
    # Starts the whole stack and walks the main flow through nginx (scripts/smoke/smoke.mjs).
    # It proves the stack starts and the flow works, not financial correctness (documentations/06
    # §5). Not a required check yet (documentations/08 §4E, E1).
    name: Smoke test (Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create a throwaway .env with generated secrets
        # Secrets are generated for this run only and never printed; the staff accounts are the
        # bootstrap accounts the backend creates at startup.
        run: |
          set -euo pipefail
          umask 077
          {
            grep -vE '^(POSTGRES_SUPERUSER_PASSWORD|WALLET_OWNER_PASSWORD|WALLET_APP_PASSWORD|JWT_PRIVATE_KEY|JWT_KID|OTP_HMAC_SECRET|REFRESH_TOKEN_PEPPER)=' .env.example
            echo "POSTGRES_SUPERUSER_PASSWORD=$(openssl rand -hex 24)"
            echo "WALLET_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "WALLET_APP_PASSWORD=$(openssl rand -hex 24)"
            bash scripts/generate-dev-secrets.sh
            echo "STAFF_ADMIN_EMAIL=smoke-admin@example.test"
            echo "STAFF_ADMIN_PASSWORD=Smoke-Admin-$(openssl rand -hex 16)"
            echo "STAFF_COMPLIANCE_EMAIL=smoke-compliance@example.test"
            echo "STAFF_COMPLIANCE_PASSWORD=Smoke-Compliance-$(openssl rand -hex 16)"
          } > .env
          # Defence in depth (owner, 2026-11-25): mask every generated value, so the runner
          # redacts it should a later step or service log ever print it.
          grep -E '^(POSTGRES_SUPERUSER_PASSWORD|WALLET_OWNER_PASSWORD|WALLET_APP_PASSWORD|JWT_PRIVATE_KEY|JWT_KID|OTP_HMAC_SECRET|REFRESH_TOKEN_PEPPER|STAFF_ADMIN_PASSWORD|STAFF_COMPLIANCE_PASSWORD)=' .env \
            | while IFS= read -r line; do echo "::add-mask::${line#*=}"; done
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Run the smoke test
        run: node scripts/smoke/smoke.mjs .env
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 backend frontend
      - name: Remove the stack and its volume
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env
