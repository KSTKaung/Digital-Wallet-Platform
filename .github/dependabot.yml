version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]
    ignore:
      # Pinned to 12.2.x: 13.0.0 fails the scan when no NVD key is set (documentations/06
      # MVP-ADR-15). Remove this once a 13.x release is verified to run without a key.
      - dependency-name: "org.owasp:dependency-check-maven"
        versions: [">= 13.0.0"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must have the same version; listed first so this group takes them.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x accepts only typescript < 6.1; revisit when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
    ignore:
      # The backend targets Java 21 LTS (documentations/06 MVP-ADR-15); a new major needs an ADR.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
