# Configuration comes from environment variables; no secrets are stored here (documentations/06 §4).
spring:
  application:
    name: wallet
  # No default in-memory user: it would generate and log a password. Set here (not only on
  # @SpringBootApplication) so test slices such as @WebMvcTest inherit it too.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    # Empty defaults: startup fails fast without a database unless a test supplies one.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Structured JSON logs (MDC fields such as correlationId are included). Never log secrets or PII.
logging:
  structured:
    format:
      console: logstash

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI JSON (/v3/api-docs) is off by default and enabled only in the local profile.
springdoc:
  api-docs:
    enabled: false
