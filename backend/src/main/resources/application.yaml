# Configuration comes from environment variables; no secrets are stored here (documentations/06 §4).
spring:
  application:
    name: wallet
  # No default in-memory user: it would generate and log a password. Set here (not only on
  # @SpringBootApplication) so test slices such as @WebMvcTest inherit it too.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    # Empty defaults: startup fails fast without a database unless a test supplies one.
    # The runtime role is wallet_app: DML only, no ownership, not a superuser (doc 06 MVP-ADR-02).
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # PostgreSQL error detail can contain row values; keep it out of exceptions and logs.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway runs as the migration owner (wallet_owner), the application as wallet_app.
    # Empty defaults on purpose: Spring Boot falls back to the application DataSource only when
    # spring.flyway.user is null. An empty value is not null, so Flyway builds its own DataSource
    # with an empty user name and startup fails at the first connection, instead of silently
    # migrating as the runtime role.
    user: ${FLYWAY_USERNAME:}
    password: ${FLYWAY_PASSWORD:}
    # Keeps flyway_schema_history out of "public"; Flyway creates this schema itself (doc 08 Q6).
    default-schema: flyway
    placeholders:
      # Role that V1 grants schema usage and default table privileges to. Brackets keep the "_":
      # without them Spring Boot's relaxed binding drops it and the key becomes "approle".
      "[app_role]": ${DB_APP_ROLE:wallet_app}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Structured JSON logs (MDC fields such as correlationId are included). Never log secrets or PII.
logging:
  structured:
    format:
      console: logstash

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OpenAPI JSON (/v3/api-docs) is off by default and enabled only in the local profile.
springdoc:
  api-docs:
    enabled: false
