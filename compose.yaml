# Local development stack (documentations/06 MVP-ADR-17). Values come from .env (gitignored);
# copy .env.example to .env first. All ports bind to 127.0.0.1 only.
#
#   docker compose up -d --build            postgres + backend + frontend
#   docker compose --profile mail up -d     ... plus Mailpit (SMTP 1025, UI http://localhost:8025)
name: digital-wallet

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wallet
      # Bootstrap superuser: used only by this container (init scripts, healthcheck), never by
      # the backend (documentations/06 MVP-ADR-02).
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      # Read by infra/postgres/init/01-create-roles.sh to create wallet_owner and wallet_app.
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:?Set WALLET_OWNER_PASSWORD in .env}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?Set WALLET_APP_PASSWORD in .env}
    ports:
      # Override POSTGRES_HOST_PORT if a local PostgreSQL already uses 5432. The backend connects
      # over the Compose network, so it is unaffected.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Init scripts run ONLY when the data volume is empty (first start). An existing volume
      # keeps its old roles: it must be recreated to run them (documentations/08 Q5).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the Unix socket: during initialisation (init scripts) the server listens on the
      # socket only, so the container is not reported healthy before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      # Runtime role (DML only, not a superuser); Flyway migrates as the schema owner.
      DB_USERNAME: wallet_app
      DB_PASSWORD: ${WALLET_APP_PASSWORD:?Set WALLET_APP_PASSWORD in .env}
      FLYWAY_USERNAME: wallet_owner
      FLYWAY_PASSWORD: ${WALLET_OWNER_PASSWORD:?Set WALLET_OWNER_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the JRE image; bash's /dev/tcp is enough to query the health endpoint.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine nginx image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
