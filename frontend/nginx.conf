# Serves the SPA and proxies the API same-origin (documentations/06 MVP-ADR-14, -17).

# Access log without query strings: `$request` would record e.g.
# `GET /api/v1/wallets/lookup?walletNumber=...`, putting wallet numbers in the container log.
# The base image's `main` format, with the requested path only (`$request_uri` up to the first
# `?`, so SPA deep links are logged as requested, not as the rewritten /index.html) instead of
# `$request`, and
# without `$http_referer` (it can carry a full URL with its query) and `$http_x_forwarded_for`
# (client-supplied here, nginx is the edge). This file is included in the `http` context.
map $request_uri $wallet_log_path {
    "~^(?<wallet_path>[^?]*)" $wallet_path;
    default                    "-";
}

log_format wallet_access_no_query '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $wallet_log_path $server_protocol" '
                                  '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 5173;
    server_name _;
    server_tokens off;

    # Same destination as the base image (symlinked to stdout); replaces its `main` access log.
    access_log /var/log/nginx/access.log wallet_access_no_query;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Request headers (Authorization, Cookie, Origin, Idempotency-Key, X-Correlation-Id) and
    # response headers (Set-Cookie, Retry-After, X-Correlation-Id) pass through unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        # The backend sets these too; keep nginx's single copy instead of sending duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        # Overwritten, not appended: whatever a client sends in this header must not reach the backend.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # The wallet lookup carries a wallet number in its query string (doc 02 §2.3). The error log
    # format cannot leave the query out, and an upstream failure logs the full request at level
    # `error`, so this one path logs only `crit` and above (owner, 2026-11-20; doc 06 MVP-ADR-14).
    # Every other API path keeps its upstream diagnostics. Same proxy settings as /api/ above.
    location = /api/v1/wallets/lookup {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8080;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Never serve or proxy internal paths (documentations/06 MVP-ADR-04).
    location /internal/ {
        return 404;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
