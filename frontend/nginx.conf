# Serves the SPA and proxies the API same-origin (documentations/06 MVP-ADR-14, -17).
server {
    listen 5173;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Request headers (Authorization, Cookie, Origin, Idempotency-Key, X-Correlation-Id) and
    # response headers (Set-Cookie, Retry-After, X-Correlation-Id) pass through unchanged.
    location /api/ {
        proxy_pass http://backend:8080;
        # The backend sets these too; keep nginx's single copy instead of sending duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Never serve or proxy internal paths (documentations/06 MVP-ADR-04).
    location /internal/ {
        return 404;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
